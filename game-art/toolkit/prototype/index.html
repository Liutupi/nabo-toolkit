<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NABO 工具箱原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+SC:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root { --bg: #0e1626; --panel: #182439; --line: #2c3d5c; --text: #EEE6DE; --dim: #8b94a7; --gold: #FFAD84; --red: #E65152; --green: #4CC38A; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #efe9e1; --panel: #ffffff; --line: #d9cfc2; --text: #182439; --dim: #6b6f78; }
  }
  :root[data-theme="light"] { --bg: #efe9e1; --panel: #ffffff; --line: #d9cfc2; --text: #182439; --dim: #6b6f78; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Noto Sans SC", "PingFang SC", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 40px; display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; }
  h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 14px; margin: 0 0 8px; color: var(--dim); font-weight: 500; }
  .badge { display: flex; align-items: center; gap: 14px; }
  .shell { background: #0b0f17; padding: 18px 14px 26px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  canvas { display: block; width: 240px; height: 320px; image-rendering: pixelated; border-radius: 4px; }
  @media (min-width: 560px) { canvas { width: 360px; height: 480px; } }
  .keys { display: flex; flex-direction: column; gap: 14px; }
  .keys button { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); color: var(--text);
    font: 600 15px "Archivo Black", sans-serif; cursor: pointer; touch-action: none; user-select: none; }
  .keys button.down { background: var(--gold); color: #182439; }
  .side { flex: 1 1 340px; max-width: 460px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row button, select { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font: inherit; cursor: pointer; }
  .row button:hover { border-color: var(--gold); }
  label { display: inline-flex; gap: 6px; align-items: center; }
  #log { font: 12px/1.6 ui-monospace, Menlo, monospace; max-height: 220px; overflow: auto; margin: 0; white-space: pre-wrap; word-break: break-all; }
  #log .t { color: var(--dim); } #log .b { color: var(--gold); }
  .hint { color: var(--dim); font-size: 12px; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <section>
    <div class="badge">
      <div class="shell"><canvas id="lcd" width="240" height="320"></canvas></div>
      <div class="keys">
        <button data-k="up" aria-label="上键">▲</button>
        <button data-k="down" aria-label="下键">▼</button>
        <button data-k="ok" aria-label="OK 键">OK</button>
      </div>
    </div>
    <p class="hint">键盘：<kbd>↑</kbd> <kbd>↓</kbd> <kbd>Enter</kbd>，按住 0.5 秒 = 长按。长按 ↑ = 返回。</p>
  </section>

  <section class="side">
    <div>
      <h1>NABO 工具箱 · 交互原型</h1>
      <div class="hint">240×320 离线遥控工牌原型。使用 ↑、↓、OK 体验工具流程；本页的蓝牙和 HID 为模拟，不会向真实设备发送按键。</div>
      <div class="hint"><a href="config.html" target="_blank" style="color:var(--gold)">打开配置页 →</a> 在那里改键位和名片，保存后这里马上生效。</div>
    </div>
    <div class="card">
      <h2>蓝牙模拟</h2>
      <div class="row">
        <button id="disc">设备断开</button>
        <button id="reconn">重新连上</button>
        <button id="wake">模拟休眠唤醒</button>
        <button id="passkey">显示配对码</button>
        <label><input type="checkbox" id="autopair" checked> 配对 3 秒后自动成功</label>
      </div>
    </div>
    <div class="card">
      <h2>调试</h2>
      <div class="row">
        <label>时间倍速 <select id="speed"><option>1</option><option>10</option><option>60</option></select></label>
        <label><input type="checkbox" id="rgb565" checked> RGB565 色彩</label>
        <label><input type="checkbox" id="sound" checked> 声音</label>
      </div>
      <div class="hint" id="info"></div>
    </div>
    <div class="card">
      <h2>发送给设备的 HID 报告</h2>
      <pre id="log"></pre>
    </div>
  </section>
</main>

<script src="assets/nabo_idle.js"></script>
<script src="tk_hid.js"></script>
<script src="tk_core.js"></script>
<script src="tk_buttons.js"></script>
<script src="tk_draw.js"></script>
<script src="tk_draw_tools.js"></script>
<script src="tk_draw_boot.js"></script>
<script>
(function () {
  'use strict';
  const canvas = document.getElementById('lcd'), g = canvas.getContext('2d', { willReadFrequently: true });
  const imgs = { clips: {} }; let voiceUrl = null;
  for (const k of ['open', 'half', 'closed']) { imgs[k] = new Image(); imgs[k].src = window.NABO_IDLE[k]; }
  fetch('assets/toolkit_sprites.json').then((r) => {
    if (!r.ok) throw new Error('Sprite manifest missing'); return r.json();
  }).then((manifest) => {
    voiceUrl = manifest.audio ? 'assets/' + manifest.audio : null;
    for (const [id, spec] of Object.entries(manifest.clips)) {
      const clip = { ...spec };
      for (const variant of ['bust', 'large', 'avatar']) {
        if (!spec[variant]) continue;
        const image = new Image(); image.src = 'assets/' + spec[variant].file;
        clip[variant] = { ...spec[variant], image };
      }
      imgs.clips[id] = clip;
    }
  }).catch(() => { /* Reference placeholders remain usable until sprites exist. */ });

  let simNow = 0, last = performance.now(), pairStart = -1;
  const st = TK.create(0);
  const STORE = 'nabo_tk_config_v1';
  function loadConfig() {
    try { TK.applyConfig(st, JSON.parse(localStorage.getItem(STORE))); } catch (e) { /* no saved config */ }
  }
  loadConfig();
  addEventListener('storage', (e) => { if (e.key === STORE) loadConfig(); });
  const $ = (id) => document.getElementById(id);
  const logEl = $('log');

  /* ---- audio ---- */
  let ac = null;
  function beep(f, ms) {
    if (!$('sound').checked) return;
    ac = ac || new AudioContext();
    const o = ac.createOscillator(), v = ac.createGain();
    o.type = 'triangle'; o.frequency.value = f; v.gain.value = 0.08;
    o.connect(v).connect(ac.destination); o.start(); o.stop(ac.currentTime + ms / 1000);
  }
  /* Boot voice: the processed clip once it exists (audio/VOICE.md), else browser TTS as a stand-in. */
  function voice(o) {
    if (!$('sound').checked) return;
    const speak = () => {
      if (!window.speechSynthesis) return;
      if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
      const u = new SpeechSynthesisUtterance(o.text); u.lang = 'zh-CN'; u.rate = 1.05;
      speechSynthesis.speak(u);
    };
    if (!voiceUrl) { speak(); return; }
    new Audio(voiceUrl).play().catch(speak);
  }
  function handle(out) {
    for (const o of out) {
      if (o.t === 'beep') beep(o.f, o.ms);
      else if (o.t === 'voice') voice(o);
      else if (o.t === 'hid') {
        const hex = o.bytes.map((b) => b.toString(16).padStart(2, '0')).join(' ');
        const line = document.createElement('div');
        line.innerHTML = '<span class="t">' + (simNow / 1000).toFixed(1).padStart(7) + 's</span> ' +
          (o.kind === 'media' ? 'R2 ' : 'R1 ') + '<span class="b">' + hex + '</span>  ';
        line.appendChild(document.createTextNode(o.label));
        logEl.prepend(line);
        while (logEl.childElementCount > 80) logEl.lastChild.remove();
      }
    }
  }
  function press(k) { handle(TK.press(st, k, simNow)); }

  /* ---- keys: short = released before 500 ms, long = fires at 500 ms ---- */
  const buttons = TKButtons.create();
  function down(k) {
    TKButtons.down(buttons, k, performance.now());
    if (buttons.active === k) document.querySelector('[data-k="' + k + '"]').classList.add('down');
  }
  function up(k) {
    for (const action of TKButtons.up(buttons, k, performance.now())) press(action);
    document.querySelector('[data-k="' + k + '"]').classList.remove('down');
  }
  const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', Enter: 'ok', ' ': 'ok' };
  addEventListener('keydown', (e) => { const k = KEYMAP[e.key]; if (k) { e.preventDefault(); if (!e.repeat) down(k); } });
  addEventListener('keyup', (e) => { const k = KEYMAP[e.key]; if (k) { e.preventDefault(); up(k); } });
  document.querySelectorAll('.keys button').forEach((b) => {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', (e) => { b.setPointerCapture(e.pointerId); down(k); });
    b.addEventListener('pointerup', () => up(k));
    b.addEventListener('pointercancel', () => {
      if (buttons.active === k) TKButtons.cancel(buttons);
      b.classList.remove('down');
    });
  });

  $('disc').onclick = () => TK.sim(st, 'disconnect', simNow);
  $('reconn').onclick = () => TK.sim(st, 'reconnect', simNow);
  $('wake').onclick = () => TK.sim(st, 'wake', simNow);
  $('passkey').onclick = () => {
    if (!st.pairing) { st.page = 'conn'; st.connSel = 3; handle(TK.press(st, 'ok', simNow)); }
    TK.sim(st, 'passkey', simNow, '123456');
  };
  addEventListener('blur', () => {
    TKButtons.cancel(buttons);
    document.querySelectorAll('.keys button').forEach((b) => b.classList.remove('down'));
  });

  function rgb565() {
    const im = g.getImageData(0, 0, 240, 320), d = im.data;
    for (let i = 0; i < d.length; i += 4) { d[i] &= 0xf8; d[i + 1] &= 0xfc; d[i + 2] &= 0xf8; }
    g.putImageData(im, 0, 0);
  }

  function frame(t) {
    const dt = Math.min(100, t - last); last = t;
    simNow += dt * Number($('speed').value);
    for (const action of TKButtons.tick(buttons, t)) press(action);
    if (st.pairing) {
      if (pairStart < 0) pairStart = simNow;
      if ($('autopair').checked && simNow - pairStart > 3000) TK.sim(st, 'paired', simNow);
    } else pairStart = -1;
    handle(TK.tick(st, simNow));
    TKDraw.draw(g, st, simNow, imgs);
    if ($('rgb565').checked) rgb565();
    $('info').textContent = '页面 ' + st.page + ' · 空闲 ' + ((simNow - st.lastInput) / 1000).toFixed(0) +
      's · ' + (TK.sleepDue(st, simNow) ? '该休眠了' : '不休眠');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* Debug hook for scripted checks and golden-trace recording. */
  window.TOOLKIT = { press, state: () => st, now: () => simNow,
    sim: (event, arg) => TK.sim(st, event, simNow, arg),
    advance: (ms) => { simNow += ms; handle(TK.tick(st, simNow)); } };
})();
</script>
</body>
</html>
